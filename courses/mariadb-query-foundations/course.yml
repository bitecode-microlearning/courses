longdescription: Build confidence reading, filtering, grouping, and joining small datasets. This course is designed for SQL developers and BI professionals working with small, understandable datasets. It covers query and transformation skills, not database administration. Backups, infrastructure operations, server tuning, capacity planning, and large-scale performance engineering are intentionally out of scope.
